name: build-ishtar-kernel

# 构建 ishtar 的 HakiOS 内核：Apple XNU 12377.121.6 + xnu-12377.121.6-dada.patch。
# 放在 x86_64 Linux 上跑，因为上游做法依赖 theos，而 theos 的 Linux 工具链只有 x86_64 版；
# 本机是 aarch64，编 cctools 会一路缺头文件。
#
# 产物：mach.ishtar（mach.development.bcm2837），用来塞进 XNUP 载荷。

on:
  workflow_dispatch:
  push:
    paths:
      - 'kernel/**'
      - '.github/workflows/build-xnu-ishtar.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates tar xz-utils build-essential clang lld llvm \
            flex bison m4 perl python3 python3-venv autoconf automake libtool \
            libssl-dev uuid-dev zlib1g-dev libelf-dev
          clang --version | head -1

      - name: 构建内核
        run: |
          chmod +x kernel/build-xnu.sh
          bash kernel/build-xnu.sh arm64

      - name: 输出摘要
        if: always()
        run: |
          ls -l mach.ishtar 2>/dev/null || true
          echo "--- setup.log 末尾 ---"; tail -20 kernel/work/setup.log 2>/dev/null || true
          echo "--- xnubuild.log 末尾 ---"; tail -40 kernel/work/xnubuild.log 2>/dev/null || true

      - name: 上传内核
        uses: actions/upload-artifact@v4
        with:
          name: mach-ishtar-kernel
          path: mach.ishtar
          if-no-files-found: warn

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-logs
          path: |
            kernel/work/*.log
          if-no-files-found: warn
