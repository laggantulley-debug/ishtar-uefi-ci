name: build-hakios-kernel

# 用上游 oosexgang/hakios-xnu-kernel + 本仓库 devices/ishtar 编真机内核。
# 触发：workflow_dispatch（API 或网页）
# 产物：hakios-kernel（+ .config）

on:
  workflow_dispatch:
  push:
    paths:
      - 'devices/ishtar/**'
      - '.github/workflows/build-hakios-kernel.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates tar xz-utils p7zip-full lz4 build-essential \
            clang lld llvm flex bison m4 perl python3 python3-venv \
            autoconf automake libtool libssl-dev uuid-dev zlib1g-dev libelf-dev
          clang --version | head -1

      - name: 克隆上游 hakios-xnu-kernel
        run: |
          git clone --depth 1 https://github.com/oosexgang/hakios-xnu-kernel.git hakios
          cd hakios && git log --oneline -1 && ls

      - name: 放入 devices/ishtar
        run: |
          mkdir -p hakios/devices
          cp -a devices/ishtar hakios/devices/
          find hakios/devices/ishtar -maxdepth 2 | head -20

      - name: make doctor（允许失败）
        continue-on-error: true
        run: cd hakios && make doctor 2>&1 | tail -40

      - name: make ishtar_defconfig
        run: |
          cd hakios
          make ishtar_defconfig
          grep -E "CONFIG_DEVICE|CONFIG_HAKIOS|CONFIG_FIRMWARE" .config | head -40 || true

      - name: make kernel
        continue-on-error: true
        run: |
          cd hakios
          make kernel 2>&1 | tail -100
          ls -l hakios-kernel 2>/dev/null || echo "hakios-kernel 没产出"

      - name: 摘要
        if: always()
        run: |
          cd hakios
          ls -l hakios-kernel 2>/dev/null || true
          find . -maxdepth 3 -name "*kernel*" -newermt "-3 hours" 2>/dev/null | head -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hakios-kernel-ishtar
          path: |
            hakios/hakios-kernel
            hakios/.config
          if-no-files-found: warn
