name: build-ishtar-uefi

# 构建 ishtar 的 UEFI 固件（SILICIUM_UEFI.fd），由以下输入组成：
#   Project-Silicium/Mu-Silicium @ hakios/BASE  +  HakiOS 两项 hook  +  ishtarPkg  +  本机抽出的 Binaries/ishtar
# 说明见 ../../README.md 与 ../../HP-TREE-REPORT.md。
#
# 跑在标准 x86_64 Ubuntu runner 上：本机 aarch64 需要两处宿主适配
# （edk2 日志进程缺 /dev/shm、arm64 BaseTools），在 runner 上都不存在。

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential clang lld llvm nasm python3 python3-venv python3-pip \
            uuid-dev acpica-tools device-tree-compiler mtools dosfstools mono-complete

      - name: 克隆 Mu-Silicium 并切到 BASE
        run: |
          BASE=$(cat hakios/BASE)
          git clone https://github.com/Project-Silicium/Mu-Silicium.git Mu-Silicium
          git -C Mu-Silicium checkout "$BASE"
          echo "Mu-Silicium 已切到 $(git -C Mu-Silicium rev-parse --short HEAD)（BASE $BASE）"

      - name: 构建固件
        run: bash build.sh

      - name: 产物校验
        run: |
          ls -l SILICIUM_UEFI-ishtar.fd
          test "$(stat -c %s SILICIUM_UEFI-ishtar.fd)" = "3145728"   # 0x300000 = FD_SIZE
          # 两项 hook 必须在树里
          grep -q "_PayloadLoop" Mu-Silicium/BootShim/BootShim.S
          grep -q "XnuLoader.h" Mu-Silicium/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/BootManager.c
          # R3 的 loader 不能是"活动"状态（注释里提到它没关系：
          # .dsc 里写明了移除原因）
          grep -vE '^[[:space:]]*#' Mu-Silicium/Platforms/Xiaomi/ishtarPkg/ishtar.dsc > /tmp/ishtar.dsc.live
          ! grep -q "UniXNUPkg" /tmp/ishtar.dsc.live
          ! grep -q "DarwinBootPkg" /tmp/ishtar.dsc.live

      - uses: actions/upload-artifact@v4
        with:
          name: SILICIUM_UEFI-ishtar
          path: |
            SILICIUM_UEFI-ishtar.fd
            Mu-Silicium/Build/ishtarPkg/RELEASE_CLANGPDB/FV/
          if-no-files-found: error
          retention-days: 14

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            Mu-Silicium/Build/BUILDLOG_ishtarPkg.txt
            Mu-Silicium/Build/ishtarPkg/**/*.txt
          if-no-files-found: warn
